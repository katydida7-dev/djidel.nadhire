<style>
:root{--bg:#f1f4f9;--card:#fff;--tx:#14213d;--mut:#64708a;--pri:#1746c9;--pri2:#0b2a7a;--bd:#e1e6f0;--ok:#15803d;--warn:#b45309;--bad:#b91c1c;--sh:0 6px 24px rgba(20,33,61,.07)}
@media (prefers-color-scheme:dark){:root{--bg:#0d1220;--card:#161d2f;--tx:#e8ecf5;--mut:#9aa6bd;--pri:#6b9bff;--pri2:#0b2a7a;--bd:#262f45;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171;--sh:none}}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 system-ui,"Segoe UI",Tahoma,Arial,sans-serif}
/* login */
.auth{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.brand{background:linear-gradient(155deg,#04060c,#0a1c4d 55%,#1746c9);color:#fff;padding:48px 40px;display:flex;flex-direction:column;justify-content:center;gap:18px}
.brand h1{margin:0;font-size:38px;line-height:1.2}.brand p{margin:0;opacity:.85;font-size:18px}
.brand ul{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:12px}
.brand li{display:flex;gap:12px;align-items:center;background:rgba(255,255,255,.12);padding:12px 16px;border-radius:12px}
.brand li b{font-size:20px}
.logo{width:120px;height:120px;background:#000;border-radius:50%;overflow:hidden;border:2px solid rgba(255,255,255,.25)}.logo img{width:100%;height:100%;object-fit:cover;display:block}
.gate{display:grid;place-items:center;padding:32px 20px}
.box{width:100%;max-width:380px;background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:28px;box-shadow:var(--sh)}
.box h2{margin:0 0 4px;font-size:24px}.box p{margin:0 0 18px;color:var(--mut)}
.box form{display:flex;flex-direction:column;gap:10px}
.box input{font-size:18px;padding:14px}
.box .p{padding:14px;font-size:18px}
@media (max-width:760px){.auth{grid-template-columns:1fr}.brand{padding:28px 22px}.brand h1{font-size:28px}.brand ul{display:none}}
/* app */
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 18px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5}
.bsm{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px}
.bsm .logo{width:42px;height:42px;border:0}
.who{display:flex;align-items:center;gap:8px;font-size:15px}.who em{font-style:normal;color:var(--mut);font-size:13px}
.av{width:32px;height:32px;border-radius:50%;background:var(--pri);color:#fff;display:grid;place-items:center;font-weight:700}
.tabs{display:flex;gap:6px;padding:14px 16px 0;max-width:960px;margin:auto;overflow-x:auto}
.tabs button{padding:10px 18px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:999px;font:inherit;cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--pri);border-color:var(--pri);color:#fff}
main{max-width:960px;margin:auto;padding:14px 16px 56px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;box-shadow:var(--sh)}
.stat b{display:block;font-size:30px;line-height:1.1}.stat span{color:var(--mut);font-size:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:var(--sh)}
h2{margin:0 0 12px;font-size:18px}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
form .wide{grid-column:1/-1}
input,select,textarea{width:100%;padding:11px 13px;border:1px solid var(--bd);border-radius:11px;background:var(--bg);color:var(--tx);font:inherit}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pri);outline-offset:1px}
button.p{padding:11px 18px;border:0;border-radius:11px;background:var(--pri);color:#fff;font:inherit;font-weight:600;cursor:pointer}
button.g{padding:6px 11px;border:1px solid var(--bd);border-radius:9px;background:none;color:var(--tx);font:inherit;cursor:pointer}
button.d{color:var(--bad)}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:start;padding:11px 8px;border-bottom:1px solid var(--bd);white-space:nowrap}
th{color:var(--mut);font-weight:600;font-size:13px}
.badge{padding:2px 11px;border-radius:999px;font-size:13px;border:1px solid currentColor}
.ok{color:var(--ok)}.warn{color:var(--warn)}
.empty{color:var(--mut);text-align:center;padding:20px}
.err{color:var(--bad);font-size:14px;min-height:20px}
.n{background:var(--bad);color:#fff;border-radius:999px;padding:0 7px;font-size:12px;margin-inline-start:6px}
@media (max-width:520px){.stats{grid-template-columns:1fr 1fr 1fr;gap:8px}.stat{padding:12px}.stat b{font-size:24px}.who em{display:none}}
</style>
</head>

const logo = cls => { const e = h("div", {class: cls}); e.append(h("img", {src: LOGO_SRC, alt: BRAND})); return e; };

const PEOPLE = {
  "نذير": ["nadhir", "نذير"],
  "يعقوب": ["yaaqoub", "يعقوب"],
  "ايمن": ["ayman", "أيمن"],
  "كريم": ["karim", "كريم"],
  "عبدو": ["abdou", "عبدو"]
};
const PASS = "atelier-2026-key"; // كلمة سر داخلية للعمال، لا يكتبها أحد
const norm = s => s.trim().replace(/[أإآ]/g, "ا").replace(/ى/g, "ي").replace(/ة/g, "ه").replace(/ء/g, "").replace(/\s+/g, " ");

async function enter(name, pin) {
  const key = norm(name), p = PEOPLE[key];
  if (!p) return "هذا الاسم غير موجود";
  const owner = key === OWNER;
  if (owner && !/^\d{4}$/.test(pin)) return "اكتب الرقم السري (4 أرقام)";
  const email = p[0] + "@atelier.app", password = owner ? "nz-" + pin : PASS;
  const r = await sb.auth.signInWithPassword({email, password});
  if (!r.error) return "";
  const u = await sb.auth.signUp({email, password, options: {data: {name: p[1]}}});
  if (!u.error && u.data.session) return "";
  return owner ? "الرقم السري غير صحيح" : "تعذّر الدخول، حاول مجدداً";
}

function loginView(msg) {
  const name = h("input", {placeholder: "اكتب اسمك", required: "", autocomplete: "off"});
  const pin = h("input", {type: "password", inputmode: "numeric", maxlength: "4", placeholder: "الرقم السري (4 أرقام)", autocomplete: "off", hidden: ""});
  name.oninput = () => { pin.hidden = norm(name.value) !== OWNER; };
  const err = h("div", {class: "err"}, msg || "");
  const f = h("form", {onsubmit: async ev => {
    ev.preventDefault(); err.textContent = "";
    const m = await enter(name.value, pin.value);
    if (m) err.textContent = m; else start();
  }}, name, pin, err, h("button", {class: "p"}, "دخول"));
  const feat = t => h("li", {}, h("b", {}, t[0]), t[1]);
  app.replaceChildren(h("div", {class: "auth"},
    h("aside", {class: "brand"}, logo("logo"), h("h1", {}, BRAND), h("p", {}, TAGLINE),
      h("ul", {}, feat(["📦", "متابعة المواد في المخزون"]), feat(["📝", "طلبات العمال تصلك مباشرة"]), feat(["📐", "قياسات النوافذ والأبواب منظمة"]))),
    h("section", {class: "gate"}, h("div", {class: "box"}, h("h2", {}, "مرحباً بك 👋"), h("p", {}, "اكتب اسمك للدخول إلى الورشة"), f))));
}

async function load() {
  const [s, r, m] = await Promise.all([
    me.role === "owner" ? sb.from("stock").select("*").order("created_at", {ascending: false}) : {data: []},
    sb.from("requests").select("*").order("created_at", {ascending: false}),
    sb.from("measures").select("*").order("created_at", {ascending: false})
  ]);
  cache = {stock: s.data || [], requests: r.data || [], measures: m.data || []};
}
async function refresh() { await load(); draw(); }
async function act(p) { const {error} = await p; if (error) alert("تعذّر الحفظ"); else refresh(); }

function tbl(cols, rows, rowFn) {
  if (!rows.length) return h("div", {class: "empty"}, "لا يوجد شيء بعد");
  return h("div", {class: "wrap"}, h("table", {},
    h("tr", {}, cols.map(c => h("th", {}, c))),
    rows.map(r => h("tr", {}, rowFn(r).map(c => h("td", {}, c))))));
}
const del = (t, id) => h("button", {class: "g d", onclick: () => confirm("حذف؟") && act(sb.from(t).delete().eq("id", id))}, "حذف");
const status = r => h("span", {class: "badge " + (r.done ? "ok" : "warn")}, r.done ? "تم التوفير" : "قيد الانتظار");

function stockTab() {
  const n = h("input", {placeholder: "المادة (مثال: أقواس الباب)", required: ""});
  const q = h("input", {type: "number", placeholder: "الكمية", required: "", min: "0", step: "any"});
  const f = h("form", {onsubmit: ev => { ev.preventDefault(); act(sb.from("stock").insert({name: n.value.trim(), qty: num(q.value)})); }},
    n, q, h("button", {class: "p"}, "إضافة"));
  const step = (r, d) => h("button", {class: "g", onclick: () => act(sb.from("stock").update({qty: Math.max(0, num(r.qty) + d)}).eq("id", r.id))}, d > 0 ? "+" : "−");
  return [h("div", {class: "card"}, h("h2", {}, "إضافة مواد وصلت"), f),
    h("div", {class: "card"}, h("h2", {}, "المخزون"),
      tbl(["المادة", "الكمية", "", "آخر إضافة", ""], cache.stock,
        r => [r.name, String(r.qty), h("span", {}, step(r, -1), " ", step(r, 1)), date(r.created_at), del("stock", r.id)]))];
}
function requestsTab() {
  return [h("div", {class: "card"}, h("h2", {}, "ما يحتاجه العمال"),
    tbl(["المادة", "الكمية", "العامل", "التاريخ", "الحالة", ""], cache.requests,
      r => [r.item, String(r.qty), r.worker_name || "", date(r.created_at), status(r),
        h("span", {}, h("button", {class: "g", onclick: () => act(sb.from("requests").update({done: !r.done}).eq("id", r.id))}, r.done ? "تراجع" : "تم"), " ", del("requests", r.id))]))];
}
function measuresList(canDel) {
  return h("div", {class: "card"}, h("h2", {}, "القياسات"),
    tbl(["النوع", "سيُصنع", "العرض × الارتفاع (سم)", "الزبون", "ملاحظات", "العامل", "التاريخ"].concat(canDel ? [""] : []), cache.measures,
      r => [r.kind, r.product || "", r.width + " × " + r.height, r.client || "", r.note || "", r.worker_name || "", date(r.created_at)].concat(canDel ? [del("measures", r.id)] : [])));
}
function reqForm() {
  const i = h("input", {placeholder: "المادة التي أحتاجها", required: ""});
  const q = h("input", {type: "number", placeholder: "الكمية", required: "", min: "0", step: "any"});
  const f = h("form", {onsubmit: ev => { ev.preventDefault(); act(sb.from("requests").insert({item: i.value.trim(), qty: num(q.value), worker_name: me.name})); }},
    i, q, h("button", {class: "p"}, "إرسال الطلب"));
  return [h("div", {class: "card"}, h("h2", {}, "طلب مواد"), f),
    h("div", {class: "card"}, h("h2", {}, "طلباتي"),
      tbl(["المادة", "الكمية", "التاريخ", "الحالة"], cache.requests, r => [r.item, String(r.qty), date(r.created_at), status(r)]))];
}
function measForm() {
  const k = h("select", {}, h("option", {}, "نافذة"), h("option", {}, "باب"));
  const pr = h("input", {class: "wide", placeholder: "ما الذي سيُصنع؟ (مثال: نافذة منزلقة بابين)", required: ""});
  const c = h("input", {placeholder: "الزبون / المكان"});
  const w = h("input", {type: "number", placeholder: "العرض (سم)", required: "", step: "any"});
  const hh = h("input", {type: "number", placeholder: "الارتفاع (سم)", required: "", step: "any"});
  const n = h("textarea", {class: "wide", rows: "2", placeholder: "ملاحظات (اللون، النوع…)"});
  const f = h("form", {onsubmit: ev => { ev.preventDefault(); act(sb.from("measures").insert({kind: k.value, product: pr.value.trim(), client: c.value.trim(), width: num(w.value), height: num(hh.value), note: n.value.trim(), worker_name: me.name})); }},
    k, pr, c, w, hh, n, h("button", {class: "p"}, "إرسال"));
  return [h("div", {class: "card"}, h("h2", {}, "قياسات نافذة أو باب"), f), measuresList(false)];
}

function draw() {
  const owner = me.role === "owner";
  const tabs = owner
    ? [["stock", "المخزون"], ["requests", "طلبات العمال"], ["measures", "القياسات"]]
    : [["req", "طلب مواد"], ["meas", "القياسات"]];
  if (!tabs.some(t => t[0] === tab)) tab = tabs[0][0];
  const pending = cache.requests.filter(r => !r.done).length;
  const nav = h("div", {class: "tabs"}, tabs.map(t => h("button", {class: t[0] === tab ? "on" : "", onclick: () => { tab = t[0]; draw(); }},
    t[1], t[0] === "requests" && pending ? h("span", {class: "n"}, String(pending)) : null)));
  const body = {stock: stockTab, requests: requestsTab, measures: () => [measuresList(true)], req: reqForm, meas: measForm}[tab]();
  const stat = (n, t, c) => h("div", {class: "stat"}, h("b", {class: c || ""}, String(n)), h("span", {}, t));
  const stats = owner ? h("div", {class: "stats"}, stat(pending, "طلبات معلّقة", pending ? "warn" : "ok"), stat(cache.stock.length, "أصناف في المخزون"), stat(cache.measures.length, "قياسات مسجّلة")) : null;
  app.replaceChildren(
    h("div", {class: "top"}, h("div", {class: "bsm"}, logo("logo"), BRAND),
      h("div", {class: "who"}, h("span", {class: "av"}, (me.name || "?")[0]), h("span", {}, me.name || ""), h("em", {}, owner ? "صاحب الورشة" : "عامل"),
        h("button", {class: "g", onclick: async () => { await sb.auth.signOut(); me = null; loginView(); }}, "خروج"))),
    nav, h("main", {}, stats, body));
}

async function start() {
  const {data: {session}} = await sb.auth.getSession();
  if (!session) return loginView();
  const {data} = await sb.from("profiles").select("*").eq("id", session.user.id).single();
  if (!data) { await sb.auth.signOut(); return loginView("الحساب غير جاهز، حاول مجدداً"); }
  me = data; await refresh();
}
start();
</script>
</body>
</html>
